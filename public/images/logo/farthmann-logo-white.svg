<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 70">
  <defs>
    <linearGradient id="bannerW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>
  </defs>

  <!-- House Icon – solid white silhouette -->
  <g transform="translate(0, 0)">
    <!-- Chimney -->
    <rect x="16" y="8" width="6" height="18" fill="white"/>
    <!-- Roof -->
    <polygon points="33,10 2,38 64,38" fill="white"/>
    <!-- House body -->
    <rect x="10" y="38" width="46" height="22" fill="white"/>
    <!-- Swoosh curve -->
    <path d="M0,66 Q22,54 36,58 Q50,62 68,52" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text: FARTHMANN -->
  <text x="80" y="36" font-family="'Montserrat', 'Arial Black', Arial, sans-serif" font-size="26" font-weight="800" fill="white" letter-spacing="1">FARTHMANN</text>

  <!-- Semi-transparent banner -->
  <rect x="80" y="43" width="210" height="22" rx="2" fill="url(#bannerW)"/>
  <!-- Text: IMMOBILIEN on banner -->
  <text x="92" y="59" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="white" letter-spacing="5">IMMOBILIEN</text>
</svg>
