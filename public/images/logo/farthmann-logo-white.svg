<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70">
  <defs>
    <linearGradient id="bannerW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>

  <!-- House Icon (white) -->
  <g transform="translate(2, 2)">
    <!-- House body -->
    <rect x="16" y="32" width="34" height="24" rx="1" fill="white"/>
    <!-- Roof -->
    <polygon points="33,6 6,32 60,32" fill="white"/>
    <!-- Chimney -->
    <rect x="17" y="11" width="7" height="16" fill="white"/>
    <!-- Window left -->
    <rect x="22" y="37" width="9" height="8" rx="1" fill="#1B2D6B" opacity="0.3"/>
    <!-- Window right -->
    <rect x="35" y="37" width="9" height="8" rx="1" fill="#1B2D6B" opacity="0.3"/>
    <!-- Door -->
    <rect x="29" y="45" width="8" height="11" rx="1" fill="#1B2D6B" opacity="0.2"/>
    <!-- Swoosh curve under house -->
    <path d="M2,62 Q20,52 33,55 Q46,58 65,50" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text: FARTHMANN -->
  <text x="80" y="34" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="white" letter-spacing="2">FARTHMANN</text>

  <!-- Semi-transparent banner -->
  <rect x="80" y="42" width="218" height="24" rx="3" fill="url(#bannerW)"/>
  <!-- Text: IMMOBILIEN on banner -->
  <text x="90" y="59" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="white" letter-spacing="6">IMMOBILIEN</text>
</svg>
