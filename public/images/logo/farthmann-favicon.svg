<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#1B2D6B"/>

  <!-- House – solid white silhouette, centered -->
  <g transform="translate(10, 8)">
    <!-- Chimney -->
    <rect x="11" y="6" width="5" height="14" fill="white"/>
    <!-- Roof -->
    <polygon points="22,8 0,30 44,30" fill="white"/>
    <!-- House body -->
    <rect x="6" y="30" width="32" height="16" fill="white"/>
    <!-- Swoosh -->
    <path d="M-2,50 Q14,40 24,44 Q34,48 48,40" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
